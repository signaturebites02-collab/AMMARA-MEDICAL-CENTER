<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ammara Medical Center</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <h1>🏥 Ammara Medical Center</h1>
      <p>Clinic Token & Patient Management</p>
    </div>
    <button id="clearAllBtn" class="danger">Clear All Records</button>
  </header>

  <main>
    <section class="stats">
      <div class="card"><span>Active Doctors</span><strong id="doctorCount">0</strong></div>
      <div class="card"><span>Today's Patients</span><strong id="patientCount">0</strong></div>
      <div class="card"><span>Next Token</span><strong id="nextToken">001</strong></div>
    </section>

    <section class="grid">
      <div class="panel">
        <h2>👨‍⚕️ Doctor Management</h2>
        <div class="add-doctor">
          <input id="doctorName" type="text" placeholder="Enter doctor name">
          <button id="addDoctorBtn">Add Doctor</button>
        </div>
        <div id="doctorList"></div>
      </div>

      <div class="panel">
        <h2>🎫 New Patient / Token</h2>
        <form id="patientForm">
          <label>Patient Name
            <input id="patientName" required type="text" placeholder="Patient name">
          </label>

          <div class="two">
            <label>Age
              <input id="patientAge" required type="number" min="0" max="120" placeholder="Age">
            </label>
            <label>Gender
              <select id="patientGender" required>
                <option value="">Select</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
              </select>
            </label>
          </div>

          <label>Doctor
            <select id="patientDoctor" required></select>
          </label>

          <button class="primary" type="submit">Generate Token & Save Patient</button>
        </form>

        <div id="tokenResult" class="token-result hidden">
          <small>Token Number</small>
          <strong id="newToken">001</strong>
          <span id="tokenDoctor"></span>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="record-head">
        <h2>📋 Patient Records</h2>
        <input id="search" type="search" placeholder="Search patient or doctor...">
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Age</th>
              <th>Gender</th>
              <th>Doctor</th>
              <th>Date</th>
              <th>Time</th>
              <th>Token</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="recordsBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
